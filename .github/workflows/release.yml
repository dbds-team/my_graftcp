name: Build and Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref to validate (the release tag for packaging)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: local/go.mod
          cache-dependency-path: local/go.sum
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl strace ripgrep
      - name: Build unified CLI
        run: ./build.sh
      - name: Run C, Go and DNS end-to-end tests
        run: make test
      - name: Check incremental build configuration
        run: scripts/test-build-config.sh
      - name: Verify CLI compatibility
        run: |
          ./local/graftcp --version
          ./local/mgraftcp --version
          ./local/graftcp --help 2>&1 | tee /tmp/graftcp-help.txt
          grep -F -- '--enable-dns' /tmp/graftcp-help.txt
          grep -F -- '--dns-server' /tmp/graftcp-help.txt
